<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the retro you so desperately look for is gone. only the ape remembers.</title>

    <link rel="icon" type="image/x-icon" href="heisstillalive.ico">

    <style>
        @font-face {
            font-family: "SecretFont";
            src: url("font.ttf") format("truetype");
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: black;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gif-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        #gif {
            cursor: pointer;
            max-width: 100%;
            max-height: 100%;
        }

        #secret {
            margin-top: 10000px;
            margin-bottom: 500px;
            color: white;
            font-family: "SecretFont", sans-serif;
            font-size: 32px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="gif-container">
        <img
            id="gif"
            src="https://deltarune.wiki/images/Man_overworld_tree.gif?cb=15l8og&h=thumb.php&f=Man_overworld_tree.gif"
            alt=""
        >
    </div>

    <div id="secret">
        he isnt here. not anymore.
    </div>

    <audio id="music" src="man.ogg" loop></audio>

    <script>
        const gif = document.getElementById("gif");
        const music = document.getElementById("music");

        document.addEventListener("click", () => {
            music.play().catch(() => {});
        }, { once: true });

        gif.addEventListener("click", () => {
            window.location.href = "/website/";
        });
    </script>

</body>
</html>
