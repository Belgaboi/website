<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the retro you so desperately look for is gone. only the ape remembers.</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gif {
            cursor: pointer;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>

<body>

    <img
        id="gif"
        src="https://deltarune.wiki/images/Man_overworld_tree.gif?cb=15l8og&h=thumb.php&f=Man_overworld_tree.gif"
        alt=""
    >

    <audio id="music" src="man.ogg" loop></audio>

    <script>
        const gif = document.getElementById("gif");
        const music = document.getElementById("music");

        document.addEventListener("click", () => {
            music.play().catch(() => {});
        }, { once: true });

        gif.addEventListener("click", () => {
            window.location.href = "/website/";
        });
    </script>

</body>
</html>
